<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>+4 - paciencia . net</title>
  <meta name="description" content="+4, um jogo original de cartas por cores e numeros no paciencia . net.">
  <link rel="canonical" href="https://paciencia.net.br/play/plus-four/">
  <link rel="icon" href="../../appicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <main class="game-shell" aria-label="+4">
    <header class="topbar">
      <a class="icon-button" href="../" aria-label="Voltar">&lt;</a>
      <div>
        <h1>+4</h1>
        <p id="status">Crie uma sala ou procure uma partida.</p>
      </div>
      <button id="leave-room" type="button" hidden>Sair</button>
    </header>

    <section class="lobby" id="lobby" aria-label="Entrada da partida">
      <button id="create-room" type="button">
        <strong>Criar sala</strong>
        <span>Gera um codigo para outro jogador entrar.</span>
      </button>
      <button id="random-room" type="button">
        <strong>Procurar sala aleatoria</strong>
        <span>Se nao houver outro jogador, voce fica aguardando.</span>
      </button>
      <button id="simulate-table" type="button">
        <strong>Jogar contra IA</strong>
        <span>Cria uma partida local com baralho embaralhado e IA adversaria.</span>
      </button>
      <div class="bot-options" aria-label="Quantidade de adversarios da IA">
        <span>Adversarios IA</span>
        <div class="bot-count-tabs">
          <button class="selected" type="button" data-bot-count="1" aria-pressed="true">1</button>
          <button type="button" data-bot-count="2" aria-pressed="false">2</button>
          <button type="button" data-bot-count="3" aria-pressed="false">3</button>
        </div>
      </div>
      <div class="join-code">
        <input id="room-code" type="text" maxlength="4" autocomplete="off" placeholder="CODIGO" aria-label="Codigo da sala">
        <button id="join-code" type="button">Entrar</button>
      </div>
    </section>

    <p class="room-info" id="room-info" hidden></p>

    <section class="table" id="table" aria-label="Mesa do +4" hidden>
      <div class="scorebar" aria-label="Placar">
        <div>
          <span>Voce</span>
          <strong id="my-score">0</strong>
        </div>
        <div>
          <span id="opponent-score-label">Adversario</span>
          <strong id="opponent-score">0</strong>
        </div>
        <div>
          <span>Rodada</span>
          <strong id="round-number">1</strong>
        </div>
      </div>

      <div class="playmat">
        <div class="player-area opponent top-player" aria-label="Cartas do adversario principal">
          <span id="top-opponent-label">Adversario</span>
          <div class="opponent-cards" id="opponent-cards"></div>
          <strong id="opponent-count">0 cartas</strong>
        </div>

        <div class="side-seat left-seat" id="left-seat" aria-label="Jogador lateral esquerdo">
          <span id="left-seat-label">Vazio</span>
          <div class="side-cards" id="left-opponent-cards"></div>
          <strong id="left-opponent-count"></strong>
        </div>

        <div class="center-table">
          <button class="draw-pile" id="draw-card" type="button" aria-label="Comprar carta">
            <strong id="draw-count">0</strong>
          </button>

          <div class="discard-card" id="discard-card" aria-label="Carta no descarte"></div>
        </div>

        <div class="side-seat right-seat" id="right-seat" aria-label="Jogador lateral direito">
          <span id="right-seat-label">Vazio</span>
          <div class="side-cards" id="right-opponent-cards"></div>
          <strong id="right-opponent-count"></strong>
        </div>

        <div class="player-area my-area" aria-label="Suas cartas">
          <span>Voce</span>
          <div class="hand" id="hand" aria-label="Sua mao"></div>
        </div>
      </div>

      <button class="next-round" id="next-round" type="button" hidden>Proxima rodada</button>
    </section>
  </main>

  <div class="color-modal" id="color-modal" role="dialog" aria-modal="true" aria-labelledby="color-modal-title" hidden>
    <div class="color-modal-panel">
      <button class="modal-close" id="color-modal-close" type="button" aria-label="Fechar">x</button>
      <h2 id="color-modal-title">Escolha uma cor</h2>
      <div class="modal-card-preview" id="color-modal-card" aria-hidden="true"></div>
      <div class="color-picker" id="color-picker" aria-label="Cores disponiveis">
        <button class="red" type="button" data-color="red" aria-label="Vermelho"></button>
        <button class="blue" type="button" data-color="blue" aria-label="Azul"></button>
        <button class="green" type="button" data-color="green" aria-label="Verde"></button>
        <button class="yellow" type="button" data-color="yellow" aria-label="Amarelo"></button>
      </div>
    </div>
  </div>

  <div class="build-version" data-build-version>Versão: desenvolvimento local</div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script src="../../build-info.js?v=__BUILD_ASSET_VERSION__"></script>
  <script type="module" src="app.js?v=16"></script>
</body>
</html>
