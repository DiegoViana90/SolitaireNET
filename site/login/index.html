<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - SolitaireNET</title>
  <link rel="icon" href="../appicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101713;
      --panel: #17241d;
      --panel-soft: #203329;
      --text: #fff6e5;
      --muted: #cabfa8;
      --gold: #d9b955;
      --line: rgba(255, 246, 229, 0.16);
      --danger: #ff9d9d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(217, 185, 85, 0.16), transparent 30rem),
        linear-gradient(135deg, var(--bg), #0e5b34 58%, #211e18);
      color: var(--text);
    }

    main {
      width: min(520px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 42px 0;
    }

    .back {
      width: fit-content;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4rem);
      line-height: 1;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(23, 36, 29, 0.9);
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .muted {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button,
    .primary {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
    }

    .provider {
      background: #f2f2f2;
      color: #111111;
    }

    .primary {
      background: var(--gold);
      color: #20160b;
    }

    .secondary {
      border: 1px solid var(--line);
      background: rgba(16, 23, 19, 0.5);
      color: var(--text);
    }

    .notice {
      border: 1px solid rgba(255, 157, 157, 0.4);
      border-radius: 8px;
      background: rgba(96, 32, 32, 0.28);
      color: var(--danger);
      padding: 12px;
      line-height: 1.45;
    }

    .profile {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      background: var(--panel-soft);
      object-fit: cover;
    }

    .profile strong {
      display: block;
      font-size: 1.08rem;
    }

    .profile span,
    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../play/">&lt; Voltar</a>
    <h1>Entrar</h1>

    <section class="panel" id="setup-panel" hidden>
      <div class="notice">
        Firebase ainda nao foi configurado neste deploy. Preencha
        <strong>site/firebase-config.js</strong> com os dados do projeto e habilite Google/GitHub no Firebase Auth.
      </div>
    </section>

    <section class="panel" id="signed-out-panel" hidden>
      <p class="muted">Entre para preparar seu perfil para ranking online e historico de partidas.</p>
      <div class="actions">
        <button class="provider" id="google-button" type="button">Entrar com Google</button>
        <button class="provider" id="github-button" type="button">Entrar com GitHub</button>
      </div>
      <div class="status" id="auth-status"></div>
    </section>

    <section class="panel" id="signed-in-panel" hidden>
      <div class="profile">
        <img class="avatar" id="avatar" alt="">
        <div>
          <strong id="display-name">Conta</strong>
          <span id="email"></span>
        </div>
      </div>
      <a class="primary" href="../play/">Jogar agora</a>
      <button class="secondary" id="sign-out-button" type="button">Sair da conta</button>
    </section>
  </main>

  <script type="module">
    import {
      authConfigured,
      signInWithGitHub,
      signInWithGoogle,
      signOutUser,
      subscribeAuth
    } from "../auth.js";

    const setupPanel = document.querySelector("#setup-panel");
    const signedOutPanel = document.querySelector("#signed-out-panel");
    const signedInPanel = document.querySelector("#signed-in-panel");
    const googleButton = document.querySelector("#google-button");
    const githubButton = document.querySelector("#github-button");
    const signOutButton = document.querySelector("#sign-out-button");
    const statusEl = document.querySelector("#auth-status");
    const avatarEl = document.querySelector("#avatar");
    const displayNameEl = document.querySelector("#display-name");
    const emailEl = document.querySelector("#email");

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function runSignIn(action) {
      setStatus("");
      googleButton.disabled = true;
      githubButton.disabled = true;

      try {
        await action();
      } catch (error) {
        setStatus(error.message || "Nao consegui entrar agora.");
      } finally {
        googleButton.disabled = false;
        githubButton.disabled = false;
      }
    }

    if (!authConfigured()) {
      setupPanel.hidden = false;
    } else {
      subscribeAuth((user) => {
        signedOutPanel.hidden = Boolean(user);
        signedInPanel.hidden = !user;

        if (!user) return;

        displayNameEl.textContent = user.displayName || "Conta";
        emailEl.textContent = user.email || "";
        avatarEl.src = user.photoURL || "../appicon.svg";
      });
    }

    googleButton.addEventListener("click", () => runSignIn(signInWithGoogle));
    githubButton.addEventListener("click", () => runSignIn(signInWithGitHub));
    signOutButton.addEventListener("click", signOutUser);
  </script>
</body>
</html>
