<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Visitas</title><style>body{font:14px system-ui;max-width:1400px;margin:2rem auto;padding:0 1rem;color:#17202a}button{padding:.6rem 1rem;cursor:pointer}#sheet{overflow:auto;border:1px solid #cbd5e1;border-radius:8px;margin-top:1rem}table{width:100%;min-width:1050px;border-collapse:separate;border-spacing:0;background:#fff}td,th{padding:.65rem .75rem;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#e2e8f0;font-weight:700;z-index:1}tbody tr:nth-child(even){background:#f8fafc}tbody tr:hover{background:#e0f2fe}td:nth-child(1){color:#475569}td:nth-child(2){font-family:monospace}td:nth-child(5){text-align:center}</style></head>
<body><h1>Visitas</h1><p id="status">Verificando login...</p><button id="login">Entrar com Google</button><section id="content" hidden><p id="summary"></p><div id="sheet"><table><thead><tr><th>Horário</th><th>IP</th><th>Método</th><th>Rota</th><th>Status</th><th>Referer</th><th>Navegador / dispositivo</th></tr></thead><tbody id="rows"></tbody></table></div></section><script type="module" src="app.js?v=6"></script></body>
</html>
