<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Visitas</title><style>body{font:14px system-ui;width:100%;box-sizing:border-box;margin:0;padding:2rem 2.5vw;color:#17202a;overflow-x:hidden}button{padding:.6rem 1rem;cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0;align-items:end}.filters label{display:flex;flex-direction:column;gap:.2rem;font-size:12px;color:#475569}.filters input,.filters select{padding:.45rem;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#17202a}#sheet{border:1px solid #cbd5e1;border-radius:8px;margin-top:1rem;overflow:hidden}table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:#fff}td,th{padding:.65rem .75rem;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{position:sticky;top:0;background:#e2e8f0;font-weight:700;z-index:1}th:nth-child(1){width:9%}th:nth-child(2){width:6%}th:nth-child(3){width:4%}th:nth-child(4){width:23%}th:nth-child(5){width:4%}th:nth-child(6){width:13%}th:nth-child(7){width:41%}tbody tr:nth-child(even){background:#f8fafc}tbody tr:hover{background:#e0f2fe}td:nth-child(1){color:#475569}td:nth-child(2){font-family:monospace}td:nth-child(5){text-align:center}@media(max-width:700px){th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7){display:none}th:nth-child(1){width:30%}th:nth-child(2){width:22%}th:nth-child(3){width:12%}th:nth-child(4){width:26%}th:nth-child(5){width:10%}}</style></head>
<body><h1>Visitas</h1><p id="status">Verificando login...</p><button id="login">Entrar com Google</button><section id="content" hidden><p id="summary"></p><div class="filters"><label>Período <select id="period"><option value="all">Todos</option><option value="today">Hoje</option><option value="yesterday">Ontem</option><option value="7days">Últimos 7 dias</option><option value="custom">Personalizado</option></select></label><label>De <input id="from" type="date"></label><label>Até <input id="to" type="date"></label><label>IP <input id="ip" placeholder="Filtrar IP"></label><label>Rota <input id="path" placeholder="Filtrar rota"></label><label>Status <input id="statusCode" type="number" placeholder="200"></label></div><div id="sheet"><table><thead><tr><th>Horário</th><th>IP</th><th>Localização</th><th>Método</th><th>Rota</th><th>Status</th><th>Referer</th><th>Navegador / dispositivo</th></tr></thead><tbody id="rows"></tbody></table></div></section><script type="module" src="app.js?v=11"></script></body>
</html>
