<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café com fumaça</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: transparent;
        font-family: system-ui, sans-serif;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      body.ready { opacity: 1; }
      .scene {
        position: relative;
        width: min(88vw, 620px);
        aspect-ratio: 1;
        overflow: hidden;
        background: transparent;
      }
      .scene img {
        position: absolute;
        display: block;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .cafe {
        z-index: 1;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: scale(1.08) translateY(8%);
      }
      .coin {
        z-index: 2;
        width: 28%;
        height: 28%;
        left: 33%;
        top: 56%;
      object-fit: contain;
      filter: none;
      }
      .smoke {
        z-index: 3;
        width: 30%;
        height: 48%;
        left: 35%;
        top: 18%;
        opacity: 0.62;
        filter: url(#warp);
      }
      .smoke-one {
        animation: float-one 5.5s ease-in-out infinite;
      }
      .smoke-two {
        width: 26%;
        left: 40%;
        top: 16%;
        opacity: 0.42;
        animation: float-two 6.5s 1.1s ease-in-out infinite;
      }
      @keyframes float-one {
        0%,
        100% {
          transform: translate(-5%, 2%) rotate(-3deg) scale(0.96);
          opacity: 0.42;
        }
        50% {
          transform: translate(7%, -4%) rotate(4deg) scale(1.08);
          opacity: 0.72;
        }
      }
      @keyframes float-two {
        0%,
        100% {
          transform: translate(5%, 3%) rotate(3deg) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: translate(-8%, -6%) rotate(-5deg) scale(1.12);
          opacity: 0.58;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true">
      <filter id="warp" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency=".015 .035"
          numOctaves="2"
          seed="8"
          result="noise"
        >
          <animate
            attributeName="baseFrequency"
            values=".015 .035;.022 .028;.015 .035"
            dur="7s"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="22"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <main class="scene" aria-label="Xícara de café com fumaça">
    <img class="cafe" src="/imagens/cafe.png" alt="Xícara de café" />
    <img class="coin" id="coin" src="/imagens/10.png" alt="" />
    <img class="smoke smoke-one" src="/imagens/fumaca.png" alt="" />
    <img class="smoke smoke-two" src="/imagens/fumaca2.png" alt="" />
    </main>
    <script>
    const coin = document.querySelector("#coin");
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d", { willReadFrequently: true });

    function removeBlackBackground(image) {
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
      for (let index = 0; index < pixels.data.length; index += 4) {
        const red = pixels.data[index];
        const green = pixels.data[index + 1];
        const blue = pixels.data[index + 2];
        const brightness = Math.max(red, green, blue);
        if (brightness < 28) pixels.data[index + 3] = 0;
        else if (brightness < 52) pixels.data[index + 3] = Math.round((brightness - 28) * 255 / 24);
      }
      context.putImageData(pixels, 0, 0);
      return canvas.toDataURL("image/png");
    }

    function loadCutout(url, target) {
      const image = new Image();
      image.onload = () => { target.src = removeBlackBackground(image); };
      image.src = url;
    }

    loadCutout("/imagens/cafe.png", document.querySelector(".cafe"));
    loadCutout("/imagens/fumaca.png", document.querySelector(".smoke-one"));
    loadCutout("/imagens/fumaca2.png", document.querySelector(".smoke-two"));
      const frames = [
        ...Array.from({ length: 9 }, (_, index) => ({
          number: index + 10,
          mirrored: false,
        })),
        ...Array.from({ length: 8 }, (_, index) => ({
          number: 17 - index,
          mirrored: true,
        })),
      ];
      const loaded = frames.map(({ number }) => {
        const image = new Image();
      image.onload = () => {
        const cutout = removeBlackBackground(image);
        image.onload = null;
        image.src = cutout;
      };
      image.src = `/imagens/${number}.png`;
        return image;
      });
    let frameIndex = 0;
    window.addEventListener("load", () => {
      window.setTimeout(() => document.body.classList.add("ready"), 450);
    });
    window.setInterval(() => {
        frameIndex = (frameIndex + 1) % frames.length;
        coin.src = loaded[frameIndex].src;
        coin.style.transform = frames[frameIndex].mirrored
          ? "scaleX(-1)"
          : "none";
      }, 120);
    </script>
  </body>
</html>
