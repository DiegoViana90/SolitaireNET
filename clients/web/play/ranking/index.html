<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking de Paciencia Online - paciencia . net</title>
  <meta name="description" content="Veja o ranking de paciencia online do paciencia . net, com partidas ranqueadas, vitorias e aproveitamento dos jogadores.">
  <link rel="canonical" href="https://paciencia.net.br/play/ranking/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="paciencia . net">
  <meta property="og:title" content="Ranking de Paciencia Online - paciencia . net">
  <meta property="og:description" content="Acompanhe vitorias e partidas ranqueadas de paciencia online.">
  <meta property="og:url" content="https://paciencia.net.br/play/ranking/">
  <meta property="og:image" content="https://paciencia.net.br/preview.svg">
  <link rel="icon" href="/appicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/play/ranking/styles.css?v=3">
</head>
<body>
  <div class="ad-slot ad-slot-top" data-ad-slot="top" aria-label="Publicidade"></div>
  <aside class="ad-slot ad-slot-left" data-ad-slot="left" aria-label="Publicidade"></aside>
  <aside class="ad-slot ad-slot-right" data-ad-slot="right" aria-label="Publicidade"></aside>

  <main>
    <section class="topbar" aria-label="Topo">
      <a class="back" href="/play/" aria-label="Voltar">&lt;</a>
      <div>
        <h1>Ranking</h1>
        <p>Partidas ranqueadas do Paciencia.</p>
      </div>
      <a class="auth-link" data-auth-link href="#login">Conta</a>
    </section>

    <section class="my-stats" data-my-stats hidden aria-label="Minhas estatisticas"></section>

    <section class="refresh-status" aria-label="Atualizacao do ranking">
      <strong data-cache-next>Atualizando...</strong>
    </section>

    <section class="ranking-panel" aria-label="Tabela do ranking">
      <div class="ranking-head">
        <span>#</span>
        <span>Jogador</span>
        <span>Partidas</span>
        <span>Vitorias</span>
        <span>Aproveitamento</span>
      </div>
      <div class="ranking-list" data-ranking-list>
        <div class="loading">Carregando ranking...</div>
      </div>
    </section>
  </main>

  <div class="ad-slot ad-slot-bottom" data-ad-slot="bottom" aria-label="Publicidade"></div>

  <div class="build-version" data-build-version>Versão: desenvolvimento local</div>
  <script src="/build-info.js?v=__BUILD_ASSET_VERSION__"></script>
  <script type="module" src="/auth-widget.js"></script>
  <script type="module" src="/play/ranking/ranking.js?v=2"></script>
  <script>
    document.querySelectorAll('[data-ad-slot]').forEach((slot) => {
      const updateVisibility = () => {
        const hasAd = slot.children.length > 0 || slot.textContent.trim().length > 0;
        slot.classList.toggle('ad-slot-visible', hasAd);
      };

      updateVisibility();
      new MutationObserver(updateVisibility).observe(slot, {
        childList: true,
        subtree: true,
        characterData: true
      });
    });
  </script>
</body>
</html>
